worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # Docker's embedded DNS; re-resolve replicas because a recreated
    # container can come back with a different IP address.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream ticweb_api {
        zone ticweb_api 64k;
        # max_fails=3: one slow answer must not mark a healthy replica (and then, with two replicas,
        # the whole service) as down for fail_timeout; a replica that is really gone fails every attempt.
        server api:8000 resolve max_fails=3 fail_timeout=5s;
        server api_2:8000 resolve max_fails=3 fail_timeout=5s;
        keepalive 32;
        # uvicorn closes an idle connection after 5 s (--timeout-keep-alive). nginx kept them 60 s, so now and then it
        # sent a POST down a connection uvicorn was closing: "Connection reset by peer" -> 502, and a POST is never
        # retried. nginx must give up on an idle connection FIRST, so keep this below 5 s.
        keepalive_timeout 4s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ticweb_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # If a replica is restarting, retry the request on the other one.
            # POST is only retried when the connection failed before it was sent.
            # NOT http_503: the API answers 503 on purpose when a DATABASE is busy or down (with Retry-After).
            # Counting that as "replica failed" made nginx drop BOTH healthy replicas (502 for everything,
            # including endpoints that never touch the database that is down).
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;
        }

        # Internal maintenance endpoint: the workers already run it, nobody outside needs it.
        location = /api/v1/orders/cleanup-expired {
            return 404;
        }

        location = /nginx-health {
            return 200 "ok\n";
        }
    }
}
