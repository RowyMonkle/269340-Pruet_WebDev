worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # Docker's embedded DNS; re-resolve replicas because a recreated
    # container can come back with a different IP address.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream ticket_api {
        zone ticket_api 64k;
        server api:8000 resolve max_fails=1 fail_timeout=5s;
        server api_2:8000 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ticket_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # If a replica is restarting, retry the request on the other one.
            # POST is only retried when the connection failed before it was sent.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }

        location = /nginx-health {
            return 200 "ok\n";
        }
    }
}
