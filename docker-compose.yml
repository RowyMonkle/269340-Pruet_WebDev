name: 269340-pruet_ticweb

# A second, isolated copy on the same machine (rehearsals) only needs env vars and -p:
#   STACK_PREFIX=rehearsal API_IMAGE=rehearsal_api:local
#   NGINX_PORT=18000 API_1_PORT=18001 API_2_PORT=18002 MONGO_HOST_PORT=27018 POSTGRES_PORT=5433
#   PG_VOLUME=rehearsal_pg MONGO_VOLUME=rehearsal_mongo
#   docker compose -p rehearsal up --build -d

x-api-env: &api-env
  POSTGRES_HOST: postgres_db
  POSTGRES_PORT: 5432
  POSTGRES_USER: dev_user
  POSTGRES_PASSWORD: dev_password
  POSTGRES_DB: main_db
  POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-20} # ADD: overridable for 503 tests (default = config.py default)
  POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-10} # ADD: overridable for 503 tests
  POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-5} # ADD: seconds to wait for a pooled connection before HTTP 503
  POSTGRES_LOCK_TIMEOUT_MS: ${POSTGRES_LOCK_TIMEOUT_MS:-5000} # a statement waits at most this long for a lock (55P03 -> 409), 0 = off
  POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-15000} # per-query timeout (57014 -> 503), 0 = off
  MONGO_SERVER_SELECTION_TIMEOUT_MS: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:-1000} # MongoDB unreachable: fail after this long (-> 503)
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7} # processed outbox rows older than this are deleted, 0 = keep
  MONGO_HOST: mongo_db
  MONGO_PORT: 27017
  MONGO_DB: main_db
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  FLAG_CACHE_SECONDS: 2
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}

x-api-service: &api-service
  image: ${API_IMAGE:-ticweb_api:local}
  restart: unless-stopped
  # uvicorn drains in-flight requests for 10 s on SIGTERM; give Docker longer than that before SIGKILL
  stop_grace_period: 20s
  environment: *api-env
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 10s
  depends_on:
    postgres_db:
      condition: service_healthy
    mongo_db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: ${STACK_PREFIX:-ticweb}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    # CP3: preload pg_stat_statements so every normalized query is counted and timed;
    # read it with scripts/pg_stats.py (DB-side proof of SQL statements per request).
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d main_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo_db:
    image: mongo:6.0
    container_name: ${STACK_PREFIX:-ticweb}_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: main_db
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: bring the schema to Alembic head before any API replica starts
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${API_IMAGE:-ticweb_api:local}
    container_name: ${STACK_PREFIX:-ticweb}_migrate
    command: ["python", "scripts/migrate.py"]
    restart: "no"
    environment: *api-env
    depends_on:
      postgres_db:
        condition: service_healthy

  # Two identical API replicas behind nginx so one can restart while the other serves
  api:
    <<: *api-service
    container_name: ${STACK_PREFIX:-ticweb}_api_1
    ports:
      - "${API_1_PORT:-8001}:8000"

  api_2:
    <<: *api-service
    container_name: ${STACK_PREFIX:-ticweb}_api_2
    ports:
      - "${API_2_PORT:-8002}:8000"

  nginx:
    image: nginx:1.27.4-alpine
    container_name: ${STACK_PREFIX:-ticweb}_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      api_2:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${PG_VOLUME:-ticket_postgres_data}
  mongo_data:
    name: ${MONGO_VOLUME:-ticket_mongo_data}
